<!DOCTYPE html>
<html>
<head>
  <base href="/smart_restuarant/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A modern digital menu and POS system.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Digital Menu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Digital Menu</title>
  <link rel="manifest" href="manifest.json">

  <!-- ================= PRE-LOADER CSS ================= -->
  <style>
    body {
      background-color: #FAFAFA;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    #loading-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FAFAFA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .food-loader {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100px;
      height: 80px;
    }

    .steam {
      position: absolute;
      width: 6px;
      height: 25px;
      background: #FF5722;
      border-radius: 10px;
      bottom: 45px;
      opacity: 0;
      animation: steam-rise 1.5s ease-out infinite;
    }
    
    .steam1 { left: 30px; animation-delay: 0s; }
    .steam2 { left: 47px; animation-delay: 0.3s; }
    .steam3 { left: 64px; animation-delay: 0.6s; }

    .bowl {
      width: 80px;
      height: 40px;
      background: #FF5722;
      border-radius: 5px 5px 40px 40px;
      margin-top: 30px; 
      position: relative;
      z-index: 2;
    }

    .plate {
      width: 100px;
      height: 8px;
      background: #FFAB91;
      border-radius: 10px;
      margin-top: 5px;
    }

    @keyframes steam-rise {
      0% { transform: translateY(10px) scaleX(1) scaleY(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-30px) scaleX(1.5) scaleY(1.2); opacity: 0; }
    }

    .loading-text {
      margin-top: 25px;
      color: #FF5722;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }
  </style>
</head>
<body>
  
  <div id="loading-box">
    <div class="food-loader">
      <div class="steam steam1"></div>
      <div class="steam steam2"></div>
      <div class="steam steam3"></div>
      <div class="bowl"></div>
      <div class="plate"></div>
    </div>
    <div class="loading-text">Cooking up the menu...</div>
  </div>

  <script>
    // 1. ফ্লাটার লোড হওয়ার পর লোডিং বক্সটি অটোমেটিক গায়েব করে দেবে
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-box');
      if (loader) {
        loader.style.display = 'none';
      }
    });

    // ================= GOD MODE: ANTI-FREEZE HACK =================
    // লজিক: ইউজার ব্রাউজার থেকে বের হয়ে গেলেই ফ্লাটার ইঞ্জিনটাকে কিল (Kill) করে দেওয়া হবে।
    // ফলে ব্রাউজার হ্যাং হতে পারবে না। আর ফিরে আসলেই ফ্রেশ রিলোড হবে।
    
    let isAppPaused = false;

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === 'hidden') {
        // ইউজার ব্রাউজার থেকে বের হয়ে গেছে। সাথে সাথে পেজটি ফ্রিজ ঠেকাতে আমরা 
        // ফ্লাটার ইঞ্জিন ক্র্যাশ করার আগেই একটি ফ্ল্যাগ সেট করে রাখবো।
        isAppPaused = true;
      } else if (document.visibilityState === 'visible') {
        // ইউজার ব্রাউজারে ফিরে এসেছে।
        if (isAppPaused) {
          // যেহেতু সে আগে বের হয়ে গিয়েছিল, তাই ফিরে আসার সাথে সাথে 
          // হ্যাং হওয়া ঠেকানোর জন্য পেজটিকে হার্ড রিলোড (Hard Reload) দিয়ে ফ্রেশ করে দেবো।
          console.log("Welcome back! Reloading app to prevent freeze...");
          window.location.href = window.location.href; 
        }
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
